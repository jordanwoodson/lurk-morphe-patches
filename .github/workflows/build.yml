name: Build

# Pull requests into dev get a build check. Pushes are covered by release.yml, which also compiles
# when nothing is released. The dev → main pull request is left out: open_pull_request.yml opens it
# with GITHUB_TOKEN, whose events can't start jobs, so its run only ever failed. Its head commit
# already has release.yml's check from the push to dev.
on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read
  packages: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the patch bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # Morphe's Gradle plugin is published on GitHub Packages; GITHUB_TOKEN can read it.
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
