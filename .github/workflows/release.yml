name: Release

# Pushes to main publish stable releases and pushes to dev pre-releases, when their commits call for one
# (see .github/scripts/release.py). Every push also gets a build check. "Run workflow" publishes a release
# an earlier run left unfinished.
on:
  workflow_dispatch:
  push:

# One run per branch at a time. Each releases the branch as it is when it starts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup host dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r tests/requirements-host.txt
          # Chrome is supplied by the GitHub-hosted Ubuntu image; fail if it is unavailable.
          google-chrome --version

      # A failed host check stops the job before any release commit, tag or publication.
      - name: Setup pinned Hermes compilers
        uses: jdx/mise-action@v3
        with:
          install_args: npm:hermes-compiler@250829098.0.19 npm:hermes-compiler@260318099.0.4

      - name: Verify host checks
        run: bin/test-host

      # Morphe's Gradle plugin is published on GitHub Packages; GITHUB_TOKEN can read it.
      - name: Release
        id: release
        if: github.ref_name == 'main' || github.ref_name == 'dev'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release.py

      # Also after a run that published something and then failed.
      - name: Attest
        if: ${{ !cancelled() && steps.release.outputs.published == 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.release.outputs.assets }}

      # The release build covers the branch; anything else (no release, other branches) builds here.
      - name: Verify project compiles
        if: steps.release.outputs.built != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
