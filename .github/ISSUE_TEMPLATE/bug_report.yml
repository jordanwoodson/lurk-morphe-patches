name: 🐞 Bug report
description: A patch misbehaves, a patched app crashes, or a setting does nothing.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, search [existing reports](https://github.com/jordanwoodson/lurk-morphe-patches/issues?q=is%3Aissue+label%3Abug)
        and skim the app's page under [docs/](https://github.com/jordanwoodson/lurk-morphe-patches/tree/main/docs):
        some things that look like bugs are documented limits. Problems inside Morphe Manager itself go to
        [the Morphe project](https://github.com/MorpheApp/morphe-manager/issues).
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Twitch
        - Kick
        - Rumble
        - Lurk settings screen
        - Workspace scripts (bin/)
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: App version, Lurk release and Morphe Manager (or Desktop) version.
      placeholder: "Twitch 31.x.y, Lurk v1.x.y, Manager 1.x.y"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android version and device
      placeholder: "Android 15, Pixel 8"
    validations:
      required: true
  - type: textarea
    id: patches
    attributes:
      label: Patches selected
      description: The patches you applied (or "defaults"), and whether the relevant switch in Lurk settings was on.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happens
      description: What you did, what you expected, what happened instead. Screenshots or a recording help.
      placeholder: |
        1. Open a live channel
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: For a crash or a patch that seems inactive, attach `adb logcat -s lurk AndroidRuntime` from around the moment it happens.
      render: shell
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Checks
      options:
        - label: The app was downloaded from APKMirror, Google Play or Uptodown and is the version Lurk lists as supported.
          required: true
        - label: I searched open and closed issues and this is not a duplicate.
          required: true
